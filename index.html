<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas anotações</title>
  <style>
    :root {
      --fundo: #f7f6f3;
      --texto: #1f2328;
      --suave: #6b7280;
      --borda: #d9d6cf;
      --destaque: #1d5c63;
      --perigo: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fundo: #16181a;
        --texto: #e8e6e1;
        --suave: #9aa0a6;
        --borda: #33373a;
        --destaque: #6fc2c9;
        --perigo: #f2877f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    main { max-width: 560px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.6rem; margin: 0 0 1.5rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    input[type="text"] {
      flex: 1;
      padding: .6rem .75rem;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--borda);
      border-radius: 6px;
    }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--destaque);
      background: var(--destaque);
      color: var(--fundo);
      padding: .6rem 1rem;
    }
    button.sec {
      background: transparent;
      color: var(--perigo);
      border-color: var(--borda);
      padding: .3rem .6rem;
    }
    :focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .7rem 0;
      border-bottom: 1px solid var(--borda);
    }
    li span { flex: 1; word-break: break-word; }
    li.feito span { text-decoration: line-through; color: var(--suave); }
    .vazio { color: var(--suave); }
    footer { margin-top: 1.5rem; color: var(--suave); font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Minhas anotações</h1>

    <form id="form">
      <input type="text" id="texto" placeholder="Escreva algo e aperte Enter" aria-label="Nova anotação" required>
      <button type="submit">Adicionar</button>
    </form>

    <ul id="lista"></ul>
    <p class="vazio" id="vazio">Nenhuma anotação ainda. Adicione a primeira acima.</p>

    <footer>As anotações ficam salvas apenas neste navegador.</footer>
  </main>

  <script>
    const CHAVE = "minhas-anotacoes";
    const form = document.getElementById("form");
    const campo = document.getElementById("texto");
    const lista = document.getElementById("lista");
    const vazio = document.getElementById("vazio");

    function carregar() {
      try {
        return JSON.parse(localStorage.getItem(CHAVE)) || [];
      } catch (e) {
        return [];
      }
    }

    function salvar(itens) {
      try {
        localStorage.setItem(CHAVE, JSON.stringify(itens));
      } catch (e) {
        alert("Não foi possível salvar neste navegador.");
      }
    }

    let itens = carregar();

    function desenhar() {
      lista.innerHTML = "";
      vazio.hidden = itens.length > 0;

      itens.forEach((item) => {
        const li = document.createElement("li");
        if (item.feito) li.classList.add("feito");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = item.feito;
        cb.setAttribute("aria-label", "Marcar como feito");
        cb.addEventListener("change", () => {
          item.feito = cb.checked;
          salvar(itens);
          desenhar();
        });

        const span = document.createElement("span");
        span.textContent = item.texto; // textContent evita injeção de HTML

        const del = document.createElement("button");
        del.type = "button";
        del.className = "sec";
        del.textContent = "Excluir";
        del.addEventListener("click", () => {
          itens = itens.filter((i) => i.id !== item.id);
          salvar(itens);
          desenhar();
        });

        li.append(cb, span, del);
        lista.appendChild(li);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const texto = campo.value.trim();
      if (!texto) return;
      itens.push({ id: Date.now(), texto, feito: false });
      salvar(itens);
      campo.value = "";
      desenhar();
    });

    desenhar();
  </script>
</body>
</html>
