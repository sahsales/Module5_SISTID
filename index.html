<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SISTID · Módulo 5 · Monitoramento</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-columns: 248px 1fr; }
    iframe { display: block; border: 0; width: 100%; height: 100%; }
    @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } #menu { height: 420px; } }
  </style>
</head>
<body>
  <!-- Moldura para rodar o menu e a tela juntos. O menu abre as telas na área ao lado. -->
  <iframe id="menu" title="Menu lateral"></iframe>
  <iframe id="tela" name="conteudo" title="Tela"></iframe>
  <script>
    // Esta é a página inicial do site. Abre a tela pedida em ?tela=... (as telas redirecionam para cá
    // quando são abertas sozinhas, sem o menu); sem pedido, abre a Visão geral.
    var TELAS = ["visao-geral.html", "indicadores.html", "relatorios.html"];
    var pedida = new URLSearchParams(location.search).get("tela");
    var tela = TELAS.indexOf(pedida) >= 0 ? pedida : "visao-geral.html";
    document.getElementById("menu").src = "menu.html?ativo=" + tela;
    document.getElementById("tela").src = tela + location.hash;
  </script>
</body>
</html>
